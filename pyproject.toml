[project]
name = "nonebot-plugin-dota2-watcher"
version = "2.0.0"
description = "DOTA2 观察者 NoneBot2 插件：DOTA2 开黑战报 / 新闻推送 / TI 赛事 / D2PT 出装"
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-apscheduler>=0.4.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "Pillow>=9.0.0",
    "fonttools>=4.0.0",
    "playwright>=1.30.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.nonebot]
plugins = ["dota2_watcher_nonebot"]

[tool.setuptools]
packages = [
    "dota2_watcher_nonebot",
    "dota2_watcher_nonebot.handlers",
    "dota2_watcher_nonebot.services",
    "dota2_watcher_nonebot.datasources",
    "dota2_watcher_nonebot.generators",
]

[tool.setuptools.package-data]
dota2_watcher_nonebot = ["fonts/*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 默认规则 E4/E7/E9/F，加上 import 排序(I)与 pyupgrade 现代化(UP)。
# 刻意不启用 N(命名)，避免破坏 player_info.json 等持久化字段名。
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
